name: Deploy demo to GitHub Pages

# Builds the dashboard as a self-contained static showcase and publishes it to
# GitHub Pages. VITE_DEMO_MODE=1 makes the sim run its own seeded GBM instead of
# the live Binance feed (Pages is static — there is no backend to serve one), and
# the UI labels itself accordingly.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # NOTE: Pages must be enabled once by hand — Settings → Pages → Source →
      # "GitHub Actions". The workflow token cannot turn it on itself
      # (configure-pages@v5 enablement:true fails with insufficient permission),
      # so until it is enabled the build succeeds and only deploy fails.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_DEMO_MODE: '1'
      # Pages serves the SPA statically; a 404 copy keeps deep links working.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
